# The gavel-tools catalog: the menu of what this module can lint, per language.
#
# This is the single source of truth a consumer (e.g. gavel) reads to know which
# tools exist, which aspect runs each one, what SARIF file it emits, which build
# flags it needs, and which tool-binary repo it depends on. The consumer's
# gavel.yaml then *selects* tools from this menu per project — it never redefines
# what a tool is.
#
# Each aspect listed here must exist in //lint/aspects:defs.bzl; that consistency
# is enforced by catalog_test. `binary` and `build_flags` are optional (only the
# tools that need them carry them). `aspects_bzl` is the module-relative label
# where the aspects live; a consumer prefixes it with the module name it binds
# gavel_tools under.
#
# `variants` (optional, per tool) swaps in a different aspect when the consumer
# builds with a different ruleset than the default entry assumes. Each variant:
#   when_bazel_dep  a module name present in the consumer's MODULE.bazel; the
#                   variant applies when it is there, else the entry itself is used
#   module          the Bazel module the consumer must depend on to get the aspect
#   aspects_bzl     module-relative label of the variant's aspects, resolved under
#                   `module` (not gavel_tools)
#   aspect          the aspect name in that file
#   build_flags     (optional) flags the variant needs, replacing the entry's
# gavel-tools never imposes a ruleset: the default entry uses the consumer's
# rules_rust, a variant uses whatever the consumer already builds with.
version: 1
aspects_bzl: //lint/aspects:defs.bzl
languages:
  go:
    - name: golangci-lint
      aspect: go_golangci_lint_submission_aspect
      sarif_suffix: .golangci.sarif
      # Canonical repo name (@@rules_go+) so this flag resolves even when the
      # consumer aliases rules_go under a different apparent name — e.g. gazelle's
      # io_bazel_rules_go, where a plain --@rules_go flag fails to resolve.
      build_flags: ["--@@rules_go+//go/config:export_stdlib=True"]
      binary: golangci_lint_binary
    - name: archtest
      aspect: go_archtest_submission_aspect
      sarif_suffix: .archtest.sarif
  java:
    - name: pmd
      aspect: java_pmd_submission_aspect
      sarif_suffix: .pmd.sarif
      binary: pmd_binary
    - name: cpd
      aspect: java_cpd_submission_aspect
      sarif_suffix: .cpd.sarif
      binary: pmd_binary
    - name: spotbugs
      aspect: java_spotbugs_submission_aspect
      sarif_suffix: .spotbugs.sarif
      binary: spotbugs_binary
    - name: error-prone
      aspect: java_error_prone_submission_aspect
      sarif_suffix: .errorprone.sarif
      binary: error_prone_binary
    - name: archtest
      aspect: java_archtest_submission_aspect
      sarif_suffix: .archtest.sarif
  python:
    - name: ruff
      aspect: python_ruff_submission_aspect
      sarif_suffix: .ruff.sarif
      binary: ruff_binary
    - name: bandit
      aspect: python_bandit_submission_aspect
      sarif_suffix: .bandit.sarif
      binary: bandit_binary
    - name: pycompile
      aspect: python_pycompile_submission_aspect
      sarif_suffix: .pycompile.sarif
    - name: archtest
      aspect: python_archtest_submission_aspect
      sarif_suffix: .archtest.sarif
  typescript:
    - name: eslint
      aspect: typescript_eslint_submission_aspect
      sarif_suffix: .eslint.sarif
    - name: archtest
      aspect: typescript_archtest_submission_aspect
      sarif_suffix: .archtest.sarif
  rust:
    - name: clippy
      module: gavel_tools_rust
      aspect: rust_clippy_submission_aspect
      sarif_suffix: .clippy.sarif
      build_flags:
        - "--@rules_rust//rust/settings:capture_clippy_output=True"
        - "--@rules_rust//rust/settings:clippy_output_diagnostics=True"
      variants:
        # rules_rs compiles with its own rules_rust repo, so the default aspect
        # never matches it (and now reports that as a failed execution). The
        # flags use rules_rs's canonical repo name, as the go entry does: the
        # apparent `@rules_rust` is not visible from a consumer's root module
        # unless it use_repo()s rules_rs's extension itself ("No repository
        # visible as '@rules_rust'"), whereas this resolves in every consumer.
        - when_bazel_dep: rules_rs
          module: gavel_tools_rust_rs
          aspects_bzl: //lint/aspects:defs.bzl
          aspect: rust_clippy_submission_aspect
          build_flags:
            - "--@@rules_rs++rules_rust+rules_rust//rust/settings:capture_clippy_output=True"
            - "--@@rules_rs++rules_rust+rules_rust//rust/settings:clippy_output_diagnostics=True"
    - name: archtest
      aspect: rust_archtest_submission_aspect
      sarif_suffix: .archtest.sarif
